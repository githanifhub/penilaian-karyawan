<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ganti Password - Perfomax{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #0e141b;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(26, 159, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(102, 192, 244, 0.05) 0%, transparent 40%),
                linear-gradient(180deg, #0e141b 0%, #0a0f15 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #dcdedf;
        }
        .blank-header {
            background: #172433;
            padding: 16px 32px;
            border-bottom: 1px solid #22354a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .blank-content {
            flex: 1;
            padding: 32px 20px;
        }
    </style>
</head>
<body>
    <header class="blank-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 38px; height: 38px; background: linear-gradient(135deg, #1a9fff 0%, #0072ce 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.15rem; box-shadow: 0 4px 12px rgba(26, 159, 255, 0.4);">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <div>
                <strong style="font-size: 1.15rem; color: #ffffff; letter-spacing: -0.02em;">Perfomax<span style="color: #66c0f4;">.</span></strong>
                <p style="font-size: 0.75rem; color: #8ba2b9; margin: 0;">Pengamanan Akun Pengguna</p>
            </div>
        </div>
        <div>
            <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm" onclick="return confirm('Apakah Anda yakin ingin logout?');">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar
            </a>
        </div>
    </header>

    <main class="blank-content">
        <!-- Flash Message Alerts -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="max-width: 520px; margin: 0 auto 16px;">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span><i class="fa-solid fa-circle-info" style="margin-right: 8px;"></i> {{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
